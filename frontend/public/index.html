<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ✅ Charset and Viewport -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ✅ Title & Theme -->
    <title>TaskHive</title>
    <meta name="theme-color" content="#000000" />

    <!-- ✅ SEO Meta Tags -->
    <meta name="description" content="TaskHive – Your ultimate task and note management app for productivity and collaboration." />
    <meta name="keywords" content="TaskHive, task manager, note taking, productivity, study planner, React app, student tools" />
    <meta name="author" content="TaskHive Team" />

    <!-- ✅ Favicon & Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Accessibility: Language set to English -->
    <meta http-equiv="Content-Language" content="en" />
  </head>

  <body aria-label="TaskHive Application Root">
    <!-- ⚠️ Show if JavaScript is disabled -->
    <noscript aria-label="No JavaScript Message">
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- ✅ React app gets injected into this root div -->
    <div id="root" aria-label="TaskHive React Root"></div>
  </body>
</html>
